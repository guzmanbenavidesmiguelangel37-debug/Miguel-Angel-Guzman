<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Software</title>
</head>

<body>

    <h1>Sistema de Gestión</h1>

    <h2>Iniciar sesión</h2>

    <label>Nombre de usuario:</label>
    <input type="text" placeholder="Escriba su usuario">

    <br><br>

    <label>Contraseña:</label>
    <input type="password" placeholder="Escriba su contraseña">

    <br><br>

    <button>Iniciar sesión</button>

    <h2>Funciones del sistema</h2>

    <ul>
        <li>Registrar usuario</li>
        <li>Modificar información</li>
        <li>Eliminar usuario</li>
        <li>Buscar información</li>
        <li>Guardar datos</li>
        <li>Cerrar sesión</li>
    </ul>

</body>
</html>
